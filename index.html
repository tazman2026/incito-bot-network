<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.ico" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#05061a">
<title>Incito Bot Network</title>
<script>
  // Phones (and small touch tablets) get the mobile build; everything else gets desktop.
  // Add ?stay to this URL to skip the automatic redirect.
  (function () {
    if (/[?&]stay\b/.test(location.search)) return;
    var ua = navigator.userAgent || '';
    var phoneUA = /iPhone|iPod|Android.+Mobile|Windows Phone|Mobile.+Firefox|BlackBerry|webOS/i.test(ua);
    var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches && !matchMedia('(hover: hover)').matches;
    var small = Math.min(screen.width || 9999, screen.height || 9999) <= 820;
    var mobile = phoneUA || (coarse && small);
    location.replace((mobile ? 'bot-network-mobile.html' : 'bot-network.html') + location.hash);
  })();
</script>
<style>
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 30%,#161c4a 0%,#080a1c 50%,#020309 100%);color:#e8ecff;
  font-family:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  h1{margin:0 0 6px;font-size:24px;background:linear-gradient(90deg,#fff,#c7d2fe 60%,#a5f3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
  a{display:flex;align-items:center;justify-content:center;width:min(320px,90vw);height:54px;border-radius:14px;color:#fff;text-decoration:none;font-weight:700;
    border:1px solid rgba(167,139,250,.6);background:linear-gradient(135deg,rgba(124,92,255,.8),rgba(56,120,255,.8))}
  a.alt{background:rgba(255,255,255,.07);border-color:rgba(160,180,255,.25)}
  p{color:#9aa6cc;font-size:14px;margin:4px 0 0}
</style>
</head>
<body>
<main>
  <h1>Incito Bot Network</h1>
  <a href="bot-network-mobile.html">Open phone version</a>
  <a class="alt" href="bot-network.html">Open desktop version</a>
  <p>Password required.</p>
</main>
</body>
</html>
